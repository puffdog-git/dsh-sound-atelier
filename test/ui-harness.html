<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--dsw-alias-border-l2:#dfe4ed;--dsw-alias-bg-layer-2:#f4f6fa;--dsw-alias-bg-layer-3:#fff;--dsw-alias-label-primary:#182236;--dsw-alias-label-secondary:#65728b;--dsw-alias-brand-primary:#557be8;--dsw-alias-interactive-bg-hover:#edf1fc}
body{background:#f5f7fb;color:#182236;font:14px system-ui,sans-serif;margin:0;padding:24px}button,input,select,textarea{font:inherit}#root{max-width:880px;margin:auto}*{box-sizing:border-box}
</style><div id="root"></div><script src="/react.js"></script><script src="/react-dom.js"></script><script>
window.__ModuleLoader__={load(spec){
  const plugin=spec.factory(id=>{if(id==='react')return React;throw new Error('Optional package unavailable')})
  const dictionaries={};const slots=[];const ready={status:'ready',writable:true}
  const scope={subscribe(){return()=>{}},getSnapshot(){return ready}}
  const forms={get(){return scope}}
  const ctx={get(name){return name==='lanSettings'?forms:null},configForms:forms,
    locale:{register(ns,locale,dict){dictionaries[locale]=dict;return()=>{}},bind(){return key=>dictionaries.zh?.[key]||dictionaries.en?.[key]||key}},
    effect(fn,label){if(label.includes('locales'))fn()},
    slots:{inject(name,fn){fn()},register(spec,component){slots.push({spec,component});return()=>{}}}}
  plugin.apply(ctx)
  window.testSlots=slots.map(s=>({name:s.spec.name,id:s.spec.id}))
  const section=slots.find(s=>s.spec.name==='settings.section')
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(section.component,section.spec.inject()))
}}
</script><script src="/client.js"></script></html>
